baseURL = "https://golanor.github.io/blog/"
title = "Or Golan's Blog"
theme = "PaperMod"

defaultContentLanguage = "en"
enableRobotsTXT = true
enableEmoji = true
pygmentsUseClasses = true

[pagination]
  pagerSize = 10

# ── Languages ─────────────────────────────────────────────────────────────
# English lives at /blog/ (default language, no subdir); Hebrew at /blog/he/.
# Content language is chosen by file name: foo.md → English, foo.he.md → Hebrew.
# The two trees are fully separate: each language has its own home feed,
# menus, archives, and tag pages.

[languages.he]
  direction = "rtl"        # PaperMod → <html dir="rtl">
  languageCode = "he"
  languageName = "עברית"
  weight = 2
  title = "הבלוג של אור גולן"

  [languages.he.params]
    author = "אור גולן"
    description = "בלוג שאינו מעיד על תוכנו או על כותבו."
    [languages.he.params.homeInfoParams]
      Title = "שלום 👋"
      Content = "רשימות על מחשוב קוונטי, פיזיקה ובינה מלאכותית — נכתב, בעקשנות, כולו ב-Emacs."

  [[languages.he.menu.main]]
    identifier = "archives"
    name = "ארכיון"
    url = "archives/"
    weight = 10

  [[languages.he.menu.main]]
    identifier = "tags"
    name = "תגיות"
    url = "tags/"
    weight = 20

  [[languages.he.menu.main]]
    identifier = "about"
    name = "עליי"
    url = "about/"
    weight = 30

  [[languages.he.menu.main]]
    identifier = "publications"
    name = "פרסומים"
    url = "publications/"
    weight = 40

[languages.en]
  direction = "ltr"
  languageCode = "en"
  languageName = "English"
  weight = 1
  title = "Or Golan's Blog"

  [languages.en.params]
    author = "Or Golan"
    description = "A blog that says nothing about its content or its author."
    [languages.en.params.homeInfoParams]
      Title = "Hello 👋"
      Content = "Notes on quantum computing, physics, and AI — written, stubbornly, entirely in Emacs."

  [[languages.en.menu.main]]
    identifier = "archives"
    name = "Archives"
    url = "archives/"
    weight = 10

  [[languages.en.menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "tags/"
    weight = 20

  [[languages.en.menu.main]]
    identifier = "about"
    name = "About"
    url = "about/"
    weight = 30

  [[languages.en.menu.main]]
    identifier = "publications"
    name = "Publications"
    url = "publications/"
    weight = 40

[markup.highlight]
  noClasses = false
  guessSyntax = false
  lineNos = false

[markup.goldmark.renderer]
  unsafe = true            # ox-hugo emits raw HTML

[caches.images]
  dir = ":cacheDir/images"

[params]
  env = "production"
  math = true
  defaultTheme = "auto"
  DateFormat = "2.1.2006"
  ShowReadingTime = true
  ShowCodeCopyButtons = true
  ShowToc = true
  ShowBreadCrumbs = true
  # Show the language switcher (עברית/English) in the header for pages that
  # have a translation; the menus above cover the rest.
  displayFullLangName = true
